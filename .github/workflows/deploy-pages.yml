name: Deploy frontend to GitHub Pages

on:
  push:
    paths:
      - frontend/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Set the API_BASE_URL repository variable to the deployed backend URL."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac
          mkdir -p _site
          cp frontend/index.html frontend/app.js frontend/styles.css _site/
          printf "window.RODAKAS_API_BASE = '%s';\n" "${API_BASE_URL%/}" > _site/config.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
