services:
  - type: web
    name: rodakas-api
    runtime: node
    buildCommand: echo "No build step required"
    startCommand: node backend/app.js
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ORIGINS
        sync: false
